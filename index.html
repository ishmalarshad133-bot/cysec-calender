<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CySec Academic Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a07;--panel:#0a1510cc;--g:#00ff9c;--g2:#00b36e;--dim:#4d8a6c;--amber:#ffb454;--pink:#ff4fa3;--line:#0f3a28;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--g);font:14px/1.5 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;min-height:100vh;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000030 2px 3px);z-index:50}
#rain{position:fixed;inset:0;z-index:0;opacity:.28}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.fl{position:absolute;left:-60px;font-size:30px;opacity:.7;filter:drop-shadow(0 0 8px #00ff9c88);animation:fly linear infinite}
@keyframes fly{0%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(55vw,-30px) rotate(10deg)}100%{transform:translate(115vw,20px) rotate(-8deg)}}
main{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:clamp(18px,4vw,26px);margin:6px 0 2px;text-shadow:0 0 12px #00ff9c88}
.cur{display:inline-block;width:10px;height:1.1em;background:var(--g);vertical-align:-3px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.sub{color:var(--dim);margin:0 0 14px}
.badge{display:inline-block;border:1px solid var(--amber);color:var(--amber);padding:1px 8px;border-radius:3px;font-size:12px;margin-left:8px}
.badge.ro{border-color:var(--dim);color:var(--dim)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;backdrop-filter:blur(3px);box-shadow:0 0 18px #00ff9c14}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
button{font:inherit;color:var(--g);background:#00ff9c12;border:1px solid var(--g2);border-radius:4px;padding:5px 11px;cursor:pointer}
button:hover{background:#00ff9c2c;box-shadow:0 0 10px #00ff9c55}
button.x{color:var(--pink);border-color:var(--pink);padding:1px 7px}
input,textarea{font:inherit;color:var(--g);background:#000a;border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
textarea{resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{color:var(--dim);text-align:center;font-size:12px}
.d{min-height:74px;border:1px solid var(--line);border-radius:5px;padding:4px;cursor:pointer;overflow:hidden;font-size:11px;background:#00000055}
.d:hover{border-color:var(--g)}
.d.o{opacity:.3}.d.t{border-color:var(--amber);box-shadow:inset 0 0 12px #ffb45433}.d.s{border-color:var(--g);background:#00ff9c18}
.d b{font-size:12px}
.ev{display:block;margin-top:2px;padding:0 3px;border-left:2px solid var(--g);color:#c9ffe5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row>*{flex:1 1 120px}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0}
.item>div{min-width:0}
.dim{color:var(--dim)}
.opt{display:block;width:100%;text-align:left;margin-top:6px;position:relative;overflow:hidden;padding:8px 10px}
.opt i{position:absolute;left:0;top:0;bottom:0;background:#00ff9c26;z-index:-1;transition:width .6s}
.opt.me{border-color:var(--amber);color:var(--amber)}
.opt span{float:right}
select{font:inherit;color:var(--g);background:#000a;border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.ev.Deadline{border-color:var(--pink)}.ev.Exam{border-color:var(--amber)}.ev.Class{border-color:#6cf}.ev.Fun{border-color:#fe6}
.ev.Assignment{border-color:#c9f}.ev.Quiz{border-color:#f96}
.prog{height:12px;border:1px solid var(--g2);border-radius:6px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));transition:width .6s}
.done{text-decoration:line-through;opacity:.5}
.poll{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.mats{margin:3px 0 0 4px;font-size:12px}
.mats a,.item a{color:var(--amber);margin-right:12px;word-break:break-all}
.mats a:hover,.item a:hover{color:var(--g)}
.jump{cursor:pointer;text-decoration:underline dotted}
@media(max-width:600px){.d{min-height:56px;font-size:10px}.ev{font-size:9px}}
@media(prefers-reduced-motion:reduce){.fl,.cur{animation:none}#rain{display:none}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div id="fx"></div>
<main id="app"></main>

<audio id="bgm" src="music.mp3" loop preload="none"></audio>
<button id="mu" style="position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:100;background:#050a07cc">🔇 music: off</button>
<script>
(function(){
  const a=document.getElementById('bgm'),b=document.getElementById('mu');
  let on=false;a.volume=.3;
  function set(v){on=v;b.textContent=v?'🔊 music: on':'🔇 music: off';
    if(v)a.play().catch(()=>{on=false;b.textContent='🔇 music: off'});else a.pause()}
  b.onclick=()=>set(!on);
})();
</script>

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={events:{},polls:[],resources:[]},votes=[],canEdit=false,editKey='',last='';
const db=true;
let voter;try{voter=localStorage.getItem('vid');if(!voter){voter=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());localStorage.setItem('vid',voter)}}catch(e){voter='anon-'+Math.random().toString(36).slice(2)+Date.now()}
let uid=voter;
let cur=new Date();cur.setDate(1);
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let sel=key(new Date());

// ---------- background fx ----------
(function(){const c=$('#rain'),x=c.getContext('2d');let w,h,cols,y;
function init(){w=c.width=innerWidth;h=c.height=innerHeight;cols=Math.floor(w/16);y=Array(cols).fill(0).map(()=>Math.random()*h/16)}
init();addEventListener('resize',init);
setInterval(()=>{x.fillStyle='rgba(5,10,7,.12)';x.fillRect(0,0,w,h);x.fillStyle='#00ff9c';x.font='14px monospace';
y.forEach((v,i)=>{x.fillText(Math.random()<.5?'0':'1',i*16,v*16);y[i]=v*16>h&&Math.random()>.975?0:v+1})},70);
const fx=$('#fx');['🐈‍⬛','🎀','☕','📚','🧑‍💻','🌱','👾','☁️','⭐','💾'].forEach((e,i)=>{const s=document.createElement('div');s.className='fl';s.textContent=e;
s.style.top=(5+i*9.5)+'vh';s.style.animationDuration=(26+i*5)+'s';s.style.animationDelay=(-i*7)+'s';fx.appendChild(s)})})();

// ---------- helpers ----------
function safeUrl(u){let s=String(u||'').trim();if(!s)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(s))s='https://'+s;
  try{const x=new URL(s);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}}
function parseLinks(txt){const out=[];for(const ln of String(txt).split('\n')){const s=ln.trim();if(!s)continue;let lab='',u=s;const p=s.indexOf('|');
  if(p>-1){lab=s.slice(0,p).trim();u=s.slice(p+1).trim()}const g=safeUrl(u);if(!g)return null;out.push({label:lab||g,url:g})}return out}
const hasMats=e=>(e.files&&e.files.length)||(e.links&&e.links.length);
function mats(e){
  const f=(e.files||[]).map(x=>`<a href="/api?file=${encodeURIComponent(x.id)}" download>📎 ${esc(x.name)}</a>`);
  const l=(e.links||[]).map(x=>{const u=safeUrl(x.url);return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(x.label||u)}</a>`:''});
  const all=f.concat(l).filter(Boolean);return all.length?`<div class="mats">${all.join('')}</div>`:''}
function resLink(r){
  if(r.fileId)return `<a href="/api?file=${encodeURIComponent(r.fileId)}" download>📎 ${esc(r.label||r.fileName||'file')}</a>`;
  const u=safeUrl(r.url);return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(r.label||u)}</a>`:esc(r.label||'')}
const busy=()=>['#et','#el','#rl','#ru'].some(s=>$(s)&&$(s).value)||['#ef','#rf'].some(s=>$(s)&&$(s).files.length);
async function uploadFiles(list,btn){const out=[];
  for(const f of list){
    if(f.size>5000000){alert(f.name+' is over 5 MB, skipped.');continue}
    btn.textContent='uploading...';btn.disabled=true;
    const r=await fetch('/api?upload=1&name='+encodeURIComponent(f.name),{method:'POST',headers:{'x-edit-key':editKey,'Content-Type':f.type||'application/octet-stream'},body:f});
    const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);
    out.push({id:d.id,name:d.name})}
  return out}

// ---------- talk to the server ----------
async function api(body){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d}
async function save(){try{await api({action:'save',key:editKey,events:S.events,polls:S.polls,resources:S.resources});await load(true)}catch(e){alert('Could not save: '+e.message)}}
async function vote(name,pid,opt){try{await api({action:'vote',voter,name,pollId:pid,option:opt});await load(true)}catch(e){alert('Vote failed: '+e.message)}}
async function load(force){
  try{const d=await (await fetch('/api',{cache:'no-store'})).json();const j=JSON.stringify(d);if(j===last&&!force)return;
    const a=document.activeElement;if(!force&&((a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName))||busy()))return;
    last=j;S={events:d.events||{},polls:d.polls||[],resources:d.resources||[]};votes=Object.entries(d.votes||{}).map(([k,v])=>({uid:k,...v}));render()}catch(e){}}

// ---------- render ----------
const CATS={Assignment:'📝',Quiz:'🧩',Deadline:'🎀',Exam:'📚',Task:'🌱',Class:'☁️',Fun:'⭐'};
let draft=null;
function render(){
  const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),today=key(new Date());
  let cells='',mt=0,md=0;
  for(let i=0;i<first;i++)cells+='<div class="d o"></div>';
  for(let d=1;d<=dim;d++){const k=key(new Date(y,m,d)),ev=S.events[k]||[];mt+=ev.length;md+=ev.filter(e=>e.done).length;
    cells+=`<div class="d ${k===today?'t':''} ${k===sel?'s':''}" data-k="${k}"><b>${d}</b>${ev.slice(0,2).map(e=>`<span class="ev ${e.cat}">${CATS[e.cat]||''} ${esc(e.title)}${hasMats(e)?' 📎':''}</span>`).join('')}${ev.length>2?`<span class="dim">+${ev.length-2} more</span>`:''}</div>`}
  const evs=S.events[sel]||[];
  const up=Object.keys(S.events).filter(k=>k>=today).sort().flatMap(k=>S.events[k].map(e=>({k,...e}))).filter(e=>!e.done).slice(0,6);
  const pct=mt?Math.round(md/mt*100):0;
  const mine=votes.find(v=>v.uid===uid);
  const catList=cat=>{const rows=Object.keys(S.events).sort().flatMap(k=>S.events[k].filter(e=>e.cat===cat).map(e=>({k,...e})));
    return rows.length?rows.map(e=>`<div class="item ${e.k<today?'dim':''}"><div><span class="${e.done?'done':''}">${e.time?`<span class="dim">[${esc(e.time)}]</span> `:''}${esc(e.title)}</span>${mats(e)}</div><span class="dim jump" data-j="${e.k}">${e.k}</span></div>`).join(''):'<p class="dim">none yet.</p>'};
  const pollHTML=S.polls.map(p=>{const vs=votes.filter(v=>v.answers&&v.answers[p.id]);
    return `<div class="poll"><b>? ${esc(p.q)}</b>${canEdit?` <button class="x" data-dp="${p.id}">rm poll</button>`:''}
    ${p.opts.map(o=>{const c=vs.filter(v=>v.answers[p.id]===o).length;return `<button class="opt ${mine?.answers?.[p.id]===o?'me':''}" data-p="${p.id}" data-o="${esc(o)}"><i style="width:${vs.length?c/vs.length*100:0}%"></i>${esc(o)}<span>${c}</span></button>`}).join('')}
    <p class="dim">${vs.length} vote${vs.length===1?'':'s'}${vs.length?' — '+vs.map(v=>esc(v.name)).join(', '):''}</p></div>`}).join('');
  $('#app').innerHTML=`
  <h1>root@cysec:~$ ./academic_calendar<span class="cur"></span></h1>
  <p class="sub">// CySec Academic Calendar 🐈‍⬛ ${canEdit?'<span class="badge">EDIT MODE</span>':'<span class="badge ro">VIEW ONLY</span>'}</p>
  <p class="dim">${Object.entries(CATS).map(([k,v])=>v+' '+k).join(' &nbsp; ')}</p>
  <section class="box"><div class="bar"><button id="pv">&lt; prev</button><b>${cur.toLocaleString('en',{month:'long'}).toUpperCase()} ${y}</b><button id="nx">next &gt;</button></div>
   <div class="grid">${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div></section>
  <section class="box"><b>&gt; ${sel}</b>
   ${evs.length?evs.map((e,i)=>`<div class="item"><div><span class="${e.done?'done':''}">${canEdit?`<input type="checkbox" data-tg="${i}" ${e.done?'checked':''} style="width:auto"> `:''}${CATS[e.cat]||''} ${e.time?`<span class="dim">[${esc(e.time)}]</span> `:''}${esc(e.title)}</span>${mats(e)}</div>${canEdit?`<button class="x" data-del="${i}">rm</button>`:''}</div>`).join(''):'<p class="dim">nothing logged for this day.</p>'}
   ${canEdit?`<div class="poll">
    <div class="row"><select id="ec" style="flex:0 0 auto">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v} ${k}</option>`).join('')}</select><input id="et" placeholder="title"><input id="tm" type="time" style="max-width:130px"></div>
    <div class="row"><textarea id="el" rows="2" placeholder="links, one per line (Drive, YouTube...) optional. Tip: name | link"></textarea></div>
    <div class="row"><span class="dim" style="flex:1 1 100%">📎 attach files (optional, max 5 MB each)</span><input id="ef" type="file" multiple style="flex:1 1 100%"></div>
    <div class="row"><button id="add">+ add</button></div></div>`:''}</section>
  <section class="box"><b>&gt; Coming up 🎀</b>${up.length?up.map(e=>`<div class="item"><span>${CATS[e.cat]||''} ${esc(e.title)}</span><span class="dim">${e.k}${e.time?' '+esc(e.time):''}</span></div>`).join(''):'<p class="dim">all clear.</p>'}</section>
  <section class="box"><b>&gt; 📝 Assignments</b>${catList('Assignment')}</section>
  <section class="box"><b>&gt; 🧩 Quizzes</b>${catList('Quiz')}</section>
  <section class="box"><b>&gt; This month’s progress</b><div class="prog"><i style="width:${pct}%"></i></div><span class="dim">${md}/${mt} done (${pct}%)</span></section>
  <section class="box"><b>&gt; POLLS</b>
   ${db?`<div class="row"><input id="nm" placeholder="your name (needed to vote)" maxlength="30" value="${esc(mine?.name||localStorageGet('nm'))}"></div>${pollHTML||'<p class="dim">no polls yet.</p>'}`:`<p class="dim">loading…</p>`}
   ${canEdit?`<div class="poll"><button id="np">+ add poll</button>${draft?`<div class="row"><input id="dq" placeholder="poll question" value="${esc(draft.q)}"></div>${draft.opts.map((o,i)=>`<div class="row"><input data-do="${i}" placeholder="option ${i+1}" value="${esc(o)}"></div>`).join('')}<div class="row"><button id="ao">+ option</button><button id="sp">publish poll</button><button id="cp" class="x">cancel</button></div>`:''}</div>`:''}</section>
  <section class="box"><b>&gt; 🔗 Links &amp; resources</b>
   ${S.resources.length?S.resources.map((r,i)=>`<div class="item"><span>${resLink(r)}</span>${canEdit?`<button class="x" data-dr="${i}">rm</button>`:''}</div>`).join(''):'<p class="dim">nothing added yet.</p>'}
   ${canEdit?`<div class="poll"><div class="row"><input id="rl" placeholder="label (e.g. Course Drive)"><input id="ru" placeholder="link (https://...) optional"></div>
    <div class="row"><input id="rf" type="file" style="flex:1 1 100%"></div>
    <div class="row"><button id="ra">+ add resource</button></div></div>`:''}</section>
  <p class="dim">${canEdit?'You are an editor: changes publish for everyone.':'Only invited editors can change plans. <button id="lg">editor login</button>'} ☕</p>`;
  if($('#lg'))$('#lg').onclick=async()=>{const k=(prompt('Edit key:')||'').trim();if(!k)return;const r=await api({action:'auth',key:k}).catch(()=>({}));if(r.ok){localStorageSet('ek',k);editKey=k;canEdit=true;render()}else alert('Wrong key')};
  $('#pv').onclick=()=>{cur.setMonth(m-1);render()};$('#nx').onclick=()=>{cur.setMonth(m+1);render()};
  document.querySelectorAll('.d[data-k]').forEach(el=>el.onclick=()=>{sel=el.dataset.k;render()});
  document.querySelectorAll('[data-j]').forEach(el=>el.onclick=()=>{const k=el.dataset.j,p=k.split('-');cur=new Date(+p[0],+p[1]-1,1);sel=k;render();scrollTo(0,0)});
  if(canEdit){
   document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.events[sel].splice(+b.dataset.del,1);if(!S.events[sel].length)delete S.events[sel];save()});
   document.querySelectorAll('[data-tg]').forEach(b=>b.onchange=()=>{S.events[sel][+b.dataset.tg].done=b.checked;save()});
   $('#add').onclick=async()=>{const t=$('#et').value.trim();if(!t)return;
     const links=parseLinks($('#el').value);if(links===null)return alert('One of the links looks wrong. Use one link per line, like https://drive.google.com/... or name | link');
     const btn=$('#add');let files=[];
     try{files=await uploadFiles($('#ef').files,btn)}catch(e){alert('Upload failed: '+e.message);btn.disabled=false;btn.textContent='+ add';return}
     const item={title:t,time:$('#tm').value,cat:$('#ec').value,done:false};if(files.length)item.files=files;if(links.length)item.links=links;
     (S.events[sel]=S.events[sel]||[]).push(item);
     S.events[sel].sort((a,b)=>(a.time||'').localeCompare(b.time||''));save()};
   document.querySelectorAll('[data-dr]').forEach(b=>b.onclick=()=>{S.resources.splice(+b.dataset.dr,1);save()});
   $('#ra').onclick=async()=>{const lab=$('#rl').value.trim(),raw=$('#ru').value.trim(),u=safeUrl(raw),fl=$('#rf').files,btn=$('#ra');
     if(raw&&!u)return alert('That link does not look right.');
     if(!u&&!fl.length)return alert('Add a link or choose a file.');
     let ups=[];
     try{ups=await uploadFiles(fl,btn)}catch(e){alert('Upload failed: '+e.message);btn.disabled=false;btn.textContent='+ add resource';return}
     if(u)S.resources.push({label:lab||u,url:u});
     ups.forEach(f=>S.resources.push({label:lab||f.name,fileId:f.id,fileName:f.name}));
     save()};
   document.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{S.polls=S.polls.filter(p=>p.id!==b.dataset.dp);save()});
   $('#np').onclick=()=>{draft={q:'',opts:['','']};render()};
   if(draft){$('#dq').oninput=e=>draft.q=e.target.value;document.querySelectorAll('[data-do]').forEach(i=>i.oninput=e=>draft.opts[+i.dataset.do]=e.target.value);
    $('#ao').onclick=()=>{draft.opts.push('');render()};$('#cp').onclick=()=>{draft=null;render()};
    $('#sp').onclick=()=>{const o=[...new Set(draft.opts.map(x=>x.trim()).filter(Boolean))];if(!draft.q.trim()||o.length<2)return alert('Add a question and at least 2 options.');S.polls.push({id:'p'+Date.now(),q:draft.q.trim(),opts:o});draft=null;save()}}}
  document.querySelectorAll('.opt').forEach(b=>b.onclick=async()=>{
    const name=$('#nm').value.trim();if(!name){$('#nm').focus();return}
    localStorageSet('nm',name);
    await vote(name,b.dataset.p,b.dataset.o)});
}
function localStorageGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function localStorageSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

render();
(async()=>{
  const h=(location.hash+'&'+location.search).match(/edit=([^&]+)/);
  try{if(h){localStorage.setItem('ek',decodeURIComponent(h[1]));history.replaceState(null,'',location.pathname)}editKey=localStorage.getItem('ek')||''}
  catch(e){if(h)editKey=decodeURIComponent(h[1])}
  if(editKey){try{const r=await api({action:'auth',key:editKey});canEdit=!!r.ok;if(!r.ok){try{localStorage.removeItem('ek')}catch(e){}}}catch(e){}}
  await load(true);setInterval(load,5000);
})();
</script>
</body>
</html>
